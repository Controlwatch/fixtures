[workspace]
resolver = "2"
members = [
    "contracts/claim-topics-and-issuers",
    "contracts/compliance",
    "contracts/identity-verifier",
    "contracts/identity-registry",
    "contracts/module-a",
    "contracts/rwa-token",
]

[workspace.package]
edition = "2024"
rust-version = "1.94.1"
version = "0.1.0"
publish = false

[workspace.dependencies]
soroban-sdk = "=28.0.0"
stellar-access = "=0.8.0"
stellar-contract-utils = "=0.8.0"
stellar-macros = "=0.8.0"
stellar-tokens = "=0.8.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true

